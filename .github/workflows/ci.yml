name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Untrusted pull-request code runs in these jobs. The workflow only needs to
# read the checkout, and every checkout explicitly avoids persisting the token.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit pinned production dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: Byte-compile Python sources
        run: python3 -m compileall -q grader.py server.py judge_runner.py judge_execution.py worker.py container_entrypoint.py job_sandbox.py job_resources.py email_auth.py problem_store.py tools deploy/host

      - name: Syntax check frontend
        run: node --check static/app.js

      - name: Check frontend id references
        run: node tools/check_frontend.js

      - name: Check design tokens (no colour literals, dark-mode coverage)
        run: node tools/check_styles.js

      - name: Test frontend requests and adaptive job polling
        run: node --test tests/test_*.js

      - name: Validate problems
        run: python3 tools/validate_problem.py

      - name: Test problem authoring tools with synthetic packages
        run: python3 -m unittest discover -s tests -p test_problem_authoring.py -v

      - name: Plagiarism self-test
        run: python3 tools/plagiarism.py

      - name: API end-to-end tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify packaged plagiarism checker (no production data)
        run: |
          docker build -t newbiegrader-ci .
          docker run --rm --network none newbiegrader-ci python tools/plagiarism.py
          docker run --rm --network none newbiegrader-ci python -m pip list --format freeze > "$RUNNER_TEMP/image-packages.txt"
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/image-packages.txt"

  critical-security:
    runs-on: ubuntu-latest
    # Root is required to exercise the real setgroups/setgid/setuid boundary.
    # Default container capabilities suffice; no privileged mode or cap_add.
    container: python:3.11-slim
    env:
      GRADER_RUNNER_CHILD: "1"
      SESSION_SECRET: "synthetic-critical-ci-secret"
      GRADER_REQUIRE_NETNS: "0"
      GRADER_ALLOW_UNISOLATED_JUDGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install synthetic-test toolchain
        run: apt-get update && apt-get install -y --no-install-recommends gcc g++
      - name: Install test dependencies
        run: pip install -r requirements.txt httpx
      - name: Run critical canaries (any skip fails)
        run: python tools/run_critical_tests.py

  queue-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newbiegrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: newbiegrader_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase roles in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          psql -X -v ON_ERROR_STOP=1 -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;'
      - name: Apply schema twice to verify idempotence
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Upgrade a legacy schema without losing history
        run: |
          createdb -h 127.0.0.1 -U postgres newbiegrader_legacy
          psql -X -v ON_ERROR_STOP=1 -d newbiegrader_legacy -f tests/legacy_schema.sql
          psql -X -v ON_ERROR_STOP=1 -d newbiegrader_legacy -f supabase/schema.sql
          psql -X -v ON_ERROR_STOP=1 -d newbiegrader_legacy -f supabase/schema.sql
          psql -X -v ON_ERROR_STOP=1 -d newbiegrader_legacy -f tests/legacy_schema_verify.sql
      - name: Verify queue RPCs against PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/queue_sql.sql

      - name: Verify server-only database privileges and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/security_sql.sql

      - name: Verify email identity claims, revocation and shared budgets
        run: psql -X -v ON_ERROR_STOP=1 -f tests/auth_sql.sql

      - name: Verify concurrent email budgets and identity claims
        run: python3 tests/auth_concurrency.py

      - name: Verify concurrent queue claims and crashed-worker lease recovery
        run: python3 tests/queue_concurrency.py
