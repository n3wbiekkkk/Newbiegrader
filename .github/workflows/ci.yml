name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile Python sources
        run: python3 -m compileall -q grader.py server.py judge_runner.py worker.py container_entrypoint.py tools

      - name: Syntax check frontend
        run: node --check static/app.js

      - name: Check frontend id references
        run: node tools/check_frontend.js

      - name: Check design tokens (no colour literals, dark-mode coverage)
        run: node tools/check_styles.js

      - name: Test adaptive job polling
        run: node --test tests/test_job_polling.js

      - name: Validate problems
        run: python3 tools/validate_problem.py

      - name: Plagiarism self-test
        run: python3 tools/plagiarism.py

      - name: API end-to-end tests
        run: python3 -m unittest discover -s tests -v

  queue-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newbiegrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: newbiegrader_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase roles in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
      - name: Apply schema twice to verify idempotence
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Verify queue RPCs against PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/queue_sql.sql
