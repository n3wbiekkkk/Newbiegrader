name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile Python sources
        run: python3 -m compileall -q grader.py server.py tools

      - name: Syntax check frontend
        run: node --check static/app.js

      - name: Check frontend id references
        run: node tools/check_frontend.js

      - name: Validate problems
        run: python3 tools/validate_problem.py

      - name: Plagiarism self-test
        run: python3 tools/plagiarism.py

      - name: API end-to-end tests
        run: python3 -m unittest discover -s tests -v
